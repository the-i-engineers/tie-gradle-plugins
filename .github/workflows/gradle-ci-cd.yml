name: Gradle CI

on:
  push:
    branches: [ main ]
    tags:
      - '*'
  pull_request:
    branches: [ main ]

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # 5.6.0
        with:
          java-version: '17'
          distribution: 'temurin'
          verify-signature: true

      - name: grant execute permission for gradlew on linux systems
        if: runner.os == 'Linux'
        run: chmod +x gradlew

      - name: gradlew test
        run: ./gradlew test --continue

      - name: publish test reports
        if: success() || failure()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # 3.0.0
        with:
          name: test report
          path: '**/build/test-results/test/TEST-*.xml'
          reporter: java-junit

  cd:
    name: cd
    runs-on: ubuntu-latest
    needs:
      - ci
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # 5.6.0
        with:
          java-version: '17'
          distribution: 'temurin'
          verify-signature: true

      - name: grant execute permission for gradlew on linux systems
        if: runner.os == 'Linux'
        run: chmod +x gradlew

      - name: build
        run: ./gradlew publishPlugins -Pgradle.publish.key=${{ secrets.GRADLE_PUBLISH_KEY }} -Pgradle.publish.secret=${{ secrets.GRADLE_PUBLISH_SECRET }}

  status-check:
    name: Status Check
    needs: [ci]
    if: always()
    runs-on: ubuntu-latest
    # Intentional fork of the-i-engineers/reusable-workflows/.github/workflows/status-check.yml
    # Re-sync manually if the source changes (this repo is public and cannot reference a private repo).
    steps:
      - name: Gate
        env:
          RESULT: >-
            ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
                && 'failure' || 'success' }}
        run: |
          if [[ "$RESULT" != "success" && "$RESULT" != "skipped" ]]; then
            echo "Required checks did not pass: $RESULT"
            exit 1
          fi
          echo "All required checks passed."
